# Cross-posts articles to Dev.to and Hashnode.
# Triggers on push (new + modified MDX files) and manual dispatch (re-process all).
name: Cross-post articles

on:
  push:
    paths:
      - "content/articles/**/*.mdx"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-process all published articles (update existing, create missing)"
        required: false
        default: false
        type: boolean

jobs:
  cross-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install gray-matter

      - name: Detect changed article files
        id: detect
        run: |
          if [ "${{ inputs.force_all }}" = "true" ]; then
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-list --max-parents=0 HEAD)
            fi

            NEW_FILES=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'content/articles/*.mdx' | head -20)
            MODIFIED_FILES=$(git diff --name-only --diff-filter=M "$BEFORE" HEAD -- 'content/articles/*.mdx' | head -20)

            echo "new_files<<EOFNEW" >> $GITHUB_OUTPUT
            echo "$NEW_FILES" >> $GITHUB_OUTPUT
            echo "EOFNEW" >> $GITHUB_OUTPUT

            echo "modified_files<<EOFMOD" >> $GITHUB_OUTPUT
            echo "$MODIFIED_FILES" >> $GITHUB_OUTPUT
            echo "EOFMOD" >> $GITHUB_OUTPUT

            echo "mode=diff" >> $GITHUB_OUTPUT

            if [ -z "$NEW_FILES" ] && [ -z "$MODIFIED_FILES" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi

            echo "New files: $NEW_FILES"
            echo "Modified files: $MODIFIED_FILES"
          fi

      - name: Cross-post articles
        if: steps.detect.outputs.has_changes == 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          MODE: ${{ steps.detect.outputs.mode }}
          NEW_FILES: ${{ steps.detect.outputs.new_files }}
          MODIFIED_FILES: ${{ steps.detect.outputs.modified_files }}
        run: node .github/scripts/cross-post.js

      - name: Commit tracking file
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/cross-posted.json
          git diff --staged --quiet || git commit -m "chore: update cross-posting tracker"
          git push
